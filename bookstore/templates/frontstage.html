<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    {% block head %}
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StreamProject 串流平台{% endblock title %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/home.png') }}?v=3" type="image/png">
    
    <!-- Hallmark Dark Cinema Styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/template.css') }}?v=11">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
    {% endblock head %}
</head>
<body class="cinema-canvas">
    <!-- Hallmark Frosted Glass Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top cinema-navbar py-2">
        <div class="container-fluid container-xxl">
            <a class="navbar-brand text-decoration-none" href="{{ url_for('bookstore.bookstore') }}">
                <span style="font-size: 1.4rem;">🎬</span>
                <span>Stream<span class="brand-accent">Project</span></span>
            </a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'bookstore.bookstore' %}active{% endif %}"
                           href="{{ url_for('bookstore.bookstore') }}">影片大廳</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'bookstore.cart' %}active{% endif %}"
                           href="{{ url_for('bookstore.cart') }}">觀看歷程</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'bookstore.orderlist' %}active{% endif %}"
                           href="{{ url_for('bookstore.orderlist') }}">訂閱方案</a>
                    </li>
                </ul>

                <div class="d-flex flex-wrap align-items-center gap-2 mt-2 mt-lg-0">
                    <div class="nav-profile-pill">
                        <span class="text-secondary small">觀看中：</span>
                        <strong class="text-white">{{ user }}</strong>
                        <a href="{{ url_for('api.profiles') }}" class="btn-cinema-subtle py-1 px-2 text-decoration-none ms-1" style="font-size: 0.78rem;">
                            切換
                        </a>
                    </div>
                    <a href="{{ url_for('api.logout') }}" class="btn-cinema-subtle py-1 px-3 text-decoration-none">
                        登出
                    </a>
                </div>
            </div>
        </div>
    </nav>
    
    <div style="padding-top: 76px;"></div>

    <main class="py-4">
        {% block content %}
        {% endblock content %}
    </main>
</body>
</html>
